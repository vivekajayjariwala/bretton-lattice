<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#ffffff"/>
  <!-- The lattice mark. The faint background grid from the in-app logo is
       dropped here: at 16px it turns to mush and muddies the diagonals, which
       are the part that carries the meaning. -->
  <path d="M6 16 16 6l10 10-10 10z" fill="none" stroke="#0e7a5f" stroke-width="2.2" stroke-linejoin="round"/>
  <g fill="#0e7a5f">
    <circle cx="6" cy="6" r="2"/>
    <circle cx="16" cy="6" r="2"/>
    <circle cx="26" cy="6" r="2"/>
    <circle cx="6" cy="16" r="2"/>
    <circle cx="16" cy="16" r="2"/>
    <circle cx="26" cy="16" r="2"/>
    <circle cx="6" cy="26" r="2"/>
    <circle cx="16" cy="26" r="2"/>
    <circle cx="26" cy="26" r="2"/>
  </g>
</svg>
